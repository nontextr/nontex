<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="shortcut icon" href="assets/img/logo.png">

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: url('assets/img/bg.jpg') no-repeat center center;
    background-size: cover;
    position: relative;
    color: #fff;
    overflow: hidden;
}

/* iOS Safari için fixed disable */
@supports (-webkit-touch-callout: none) {
    body {
        background-attachment: scroll !important;
    }
}

/* Overlay */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.25);
    z-index: 0;
}

/* KAYAN UŞAK YAZISI */
.bg-text {
    position: absolute;
    top: 50%;
    left: -100%;
    font-size: 20vw;
    font-weight: 900;
    letter-spacing: 20px;
    color: rgba(255, 255, 255, 0.05);
    white-space: nowrap;
    z-index: 0;
    animation: slideText 20s linear infinite;
    transform: translateY(-50%);
    pointer-events: none;
}


@keyframes slideText {
    from {
        right: -300%;
    }
    to {
        right: 100%;
    }
}

/* Content */
#app {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Logo */
.logo {
    width: 250px;
    height: 250px;
    margin-top: 25px;
    background: url('assets/img/logo.png') no-repeat center center;
    background-size: contain;
}

/* Title */
h1 {
    font-size: 3rem;
    letter-spacing: 5px;
    margin: 150px 0 10px;
}

/* Timer */
#timer {
    font-size: 1.5rem;
    letter-spacing: 2px;
    margin-top: 5px;
}
#timer span { font-weight: bold; }

/* Email Form */
.notify-form {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    justify-content: center;
}

.notify-form input {
    padding: 12px 15px;
    font-size: 1rem;
    border-radius: 4px;
    min-width: 260px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.85);
    color: #000;
}

.notify-form input:focus {
    outline: none;
    background: #fff;
}

.notify-form button {
    padding: 12px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: rgba(255,255,255,0.9);
    color: #000;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.notify-form button:hover { background: #ddd; }

/* Footer */
.copyright {
    position: relative;
    margin-top: auto;
    padding: 20px 0;
    width: 100%;
    font-size: 0.9rem;
    z-index: 1;
}

/* Mobile */
@media (max-width: 600px) {
    h1 { font-size: 2rem; }
    #timer { font-size: 1.2rem; }
    .bg-text { font-size: 30vw; }

    .notify-form {
        flex-direction: column;
        width: 80%;
    }
    .notify-form input { width: 100%; }
}
</style>
</head>

<body>

<!-- KAYAN ARKA YAZI -->
<div class="bg-text">UŞAK</div>

<div id="app">
    <div class="logo"></div>

    <h1>COMING SOON</h1>

    <p id="timer">
        <span id="days">0</span> DAYS 
        <span id="hours">0</span> HOURS 
        <span id="minutes">0</span> MINUTES 
        <span id="seconds">0</span> SECONDS
    </p>

    <form 
      class="notify-form"
      action="https://formspree.io/f/mqarbdea"
      method="POST">
        <input type="email" name="email" placeholder="Enter Your Email" required>
        <button type="submit">Notify Me</button>
    </form>
</div>

<div class="copyright">
    nontex.com.tr - nontextekstil@gmail.com
</div>

<script>
const launchDate = new Date("2025-12-31T00:00:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance < 0) {
        document.getElementById("timer").innerHTML = "LAUNCHED!";
        return;
    }

    document.getElementById("days").textContent =
        Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById("hours").textContent =
        Math.floor((distance / (1000 * 60 * 60)) % 24);
    document.getElementById("minutes").textContent =
        Math.floor((distance / (1000 * 60)) % 60);
    document.getElementById("seconds").textContent =
        Math.floor((distance / 1000) % 60);
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
