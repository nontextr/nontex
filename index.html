<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="shortcut icon" href="assets/img/logo.png">

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: url('assets/img/bg.jpg') no-repeat center center fixed;
    background-size: cover;
    position: relative;
    color: #fff;
}

/* Overlay */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.4);
}

/* Content */
#app {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Logo */
.logo {
    width: 250px;
    height: 250px;
    margin-top: 25px;
    background: url('assets/img/logo.png') no-repeat center center;
    background-size: contain;
}

/* Title */
h1 {
    font-size: 3rem;
    letter-spacing: 5px;
    margin: 200px 0 10px;
}

/* Timer */
#timer {
    font-size: 1.5rem;
    letter-spacing: 2px;
    margin-top: 10px;
}

#timer span {
    font-weight: bold;
}

/* Email Form */
.notify-form {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    justify-content: center;
}

.notify-form input {
    padding: 12px 15px;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    min-width: 260px;
}

.notify-form button {
    padding: 12px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.notify-form button:hover {
    background: #ddd;
}

.form-note {
    margin-top: 8px;
    font-size: 0.85rem;
    opacity: 0.8;
}

/* Footer */
.copyright {
    position: absolute;
    bottom: 20px;
    width: 100%;
    font-size: 0.9rem;
}

/* Mobile */
@media (max-width: 600px) {
    h1 { font-size: 2rem; }
    #timer { font-size: 1.2rem; }

    .notify-form {
        flex-direction: column;
        width: 80%;
    }

    .notify-form input {
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="app">
    <div class="logo"></div>

    <h1>COMING SOON</h1>

    <p id="timer">
        <span id="days">0</span> DAYS 
        <span id="hours">0</span> HOURS 
        <span id="minutes">0</span> MINUTES 
        <span id="seconds">0</span> SECONDS
    </p>

    <!-- EMAIL FORM -->
    <form 
      class="notify-form"
      action="https://formspree.io/f/mqarbdea"
      method="POST">

        <input
          type="email"
          name="email"
          placeholder="E-posta adresinizi girin"
          required>

        <button type="submit">Notify Me.</button>
    </form>
    </div>

</div>

<div class="copyright">
    nontex.com.tr - nontextekstil@gmail.com
</div>

<script>
const launchDate = new Date("2025-12-31T00:00:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance < 0) {
        document.getElementById("timer").innerHTML = "LAUNCHED!";
        return;
    }

    document.getElementById("days").textContent =
        Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById("hours").textContent =
        Math.floor((distance / (1000 * 60 * 60)) % 24);
    document.getElementById("minutes").textContent =
        Math.floor((distance / (1000 * 60)) % 60);
    document.getElementById("seconds").textContent =
        Math.floor((distance / 1000) % 60);
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
