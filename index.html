<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="shortcut icon" href="assets/img/logo.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: url('assets/img/bg.jpg') no-repeat center center;
    background-size: cover;
    position: relative;
    color: #fff;
    overflow-x: hidden;
}

/* iOS Safari */
@supports (-webkit-touch-callout: none) {
    body { background-attachment: scroll !important; }
}

/* Overlay */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 0;
}

/* SCROLL BAĞIMLI KAYAN YAZI */
.bg-text {
    position: absolute;
    top: 50%;
    right: -120%;
    font-size: 20vw;
    font-weight: 900;
    letter-spacing: 20px;
    white-space: nowrap;
    color: rgba(255,255,255,0.1);
    transform: translateY(-50%);
    z-index: 0;
    pointer-events: none;
}

/* Content */
#app {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    width: 250px;
    height: 250px;
    margin-top: 25px;
    background: url('assets/img/logo.png') no-repeat center center;
    background-size: contain;
}

h1 {
    font-size: 3rem;
    letter-spacing: 5px;
    margin: 150px 0 10px;
}

#timer {
    font-size: 1.5rem;
    letter-spacing: 2px;
}
#timer span { font-weight: bold; }

/* Form */
.notify-form {
    margin-top: 30px;
    display: flex;
    gap: 10px;
}

.notify-form input {
    padding: 12px;
    font-size: 1rem;
    border-radius: 4px;
    min-width: 260px;
    background: rgba(255,255,255,0.85);
}

.notify-form button {
    padding: 12px 20px;
    border-radius: 4px;
    background: rgba(255,255,255,0.9);
    cursor: pointer;
    font-weight: bold;
}

/* Footer */
.copyright {
    margin-top: auto;
    padding: 20px;
    z-index: 1;
}

@media(max-width:600px){
    h1{font-size:2rem}
    .bg-text{font-size:30vw}
}
</style>
</head>

<body>

<!-- KAYAN YAZI -->
<div class="bg-text" id="bgText">UŞAK</div>

<div id="app">
    <div class="logo"></div>
    <h1>COMING SOON</h1>
    <p id="timer">
        <span id="days">0</span> DAYS
        <span id="hours">0</span> HOURS
        <span id="minutes">0</span> MINUTES
        <span id="seconds">0</span> SECONDS
    </p>

    <form class="notify-form" action="https://formspree.io/f/mqarbdea" method="POST">
        <input type="email" name="email" placeholder="Enter Your Email" required>
        <button type="submit">Notify Me</button>
    </form>
</div>

<div class="copyright">
    nontex.com.tr - nontextekstil@gmail.com
</div>

<script>
/* TIMER */
const launchDate = new Date("2025-12-31T00:00:00").getTime();
setInterval(() => {
    const d = launchDate - Date.now();
    if (d < 0) return;
    days.textContent = Math.floor(d / 86400000);
    hours.textContent = Math.floor(d / 3600000 % 24);
    minutes.textContent = Math.floor(d / 60000 % 60);
    seconds.textContent = Math.floor(d / 1000 % 60);
}, 1000);

/* SCROLL SPEED PARALLAX TEXT */
let lastScrollY = window.scrollY;
let position = window.innerWidth * 1.2;

window.addEventListener("scroll", () => {
    const currentScroll = window.scrollY;
    const speed = currentScroll - lastScrollY;

    position -= speed * 1.2; // hassasiyet

    document.getElementById("bgText").style.transform =
        `translate(${position}px, -50%)`;

    lastScrollY = currentScroll;
});
</script>

</body>
</html>
